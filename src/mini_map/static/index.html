<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>living-npc mini-map</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="map"></canvas>

  <aside id="status-panel">
    <div class="status-row">
      <span id="status-time" class="value">--</span>
    </div>
    <div class="status-row">
      <span id="status-weather" class="value">--</span>
    </div>
    <div class="status-row status-row--labeled">
      <span class="label" title="How many in-game minutes pass per real minute -- controls how fast the clock runs">Game-min/real-min</span>
      <span id="status-game-minutes-per-real-minute" class="value">--</span>
    </div>
    <div class="status-row status-row--labeled">
      <span class="label" title="How many times each idle NPC gets queried per in-game hour, regardless of clock speed">LLM calls/game-hr</span>
      <span id="status-llm-calls-per-game-hour" class="value">--</span>
    </div>
    <div class="status-row status-row--labeled">
      <span class="label" title="Derived: actual NPC LLM query rounds per real minute, given the tick rate and game-hour setting above">LLM calls/real-min</span>
      <span id="status-llm-calls-per-real-minute" class="value">--</span>
    </div>
    <div class="status-row">
      <button id="status-playstate" class="value playstate-btn" type="button">Paused</button>
    </div>
  </aside>

  <div id="conversation" class="hidden">
    <div id="conversation-target"></div>
    <div id="conversation-log"></div>
    <form id="conversation-form" autocomplete="off">
      <textarea id="conversation-input" rows="1" placeholder="Type to talk to an NPC..."></textarea>
      <button type="submit">Send</button>
    </form>
  </div>

  <div id="proximity-hint" class="hidden">Press <kbd>E</kbd> to talk</div>

  <script src="app.js"></script>
</body>
</html>
